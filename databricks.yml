# Databricks Asset Bundle for the Thailand PM2.5 lakehouse.
# Workspace host is NOT committed: the CLI reads it from your profile
# (~/.databrickscfg) locally, or from DATABRICKS_HOST in CI.
bundle:
  name: thai_air_quality_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all tables and volumes (passed to notebooks as a job parameter)
    default: air_quality
  warehouse_id:
    description: SQL warehouse that runs the dashboard and alert queries
    lookup:
      warehouse: Serverless Starter Warehouse
  alert_pause_status:
    description: UNPAUSED in prod, PAUSED in dev so dev never emails
    default: UNPAUSED

targets:
  # Personal copy for testing changes. Development mode prefixes resource
  # names with "[dev <user>]" and pauses job schedules. It writes to its own
  # catalog, so testing never touches production tables.
  dev:
    mode: development
    default: true
    variables:
      catalog: air_quality_dev
      alert_pause_status: PAUSED

  # The real hourly pipeline.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    resources:
      dashboards:
        pm25_monitor:
          # Keep the dashboard where it was first created so its ID and link
          # stay the same (parent_path cannot change without recreating it).
          parent_path: /Workspace/Users/${workspace.current_user.userName}
